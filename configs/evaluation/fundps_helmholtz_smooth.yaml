outdir: outputs/evaluation/fundps_helmholtz_smooth
name: fm4pde_helmholtz_smooth_first100
dataset: helmholtz
data_path: __set_by_launcher__
data_offset: 0
resolution: 128
max_size: 100
batch_size: 1
pkl_path: __required__
rbf_scale: 0.05
seed: 0
init_latents: rbf
iterations: 500
sigma_min: 0.002
sigma_max: 80
rho: 7
observation:
- type: sparse
  loss_type: l2
  known_indices:
  - 500
  - 500
  normalize: true
- type: pde
  loss_type: huber
  derivative_method: finite_diff
guidance:
  type: dps
  weights:
  - 0
  - 5000
  - 1
n_plots: 1
n_process_steps: 2
wandb: offline
